<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Membros &amp; FAs · Videira SCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#eef2f7;font-family:'Libre Franklin',system-ui,sans-serif;color:#14243a}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-thumb{background:#c3cfde;border-radius:8px;border:2px solid #eef2f7}
  select,input,button{font-family:inherit}
  table tr[data-hover]:hover{background:#f5f8fc}

  /* ---- layout: menu lateral + conteúdo ---- */
  .app-shell{display:flex;align-items:stretch;min-height:100vh}
  .sidebar{flex:0 0 252px;width:252px;background:linear-gradient(180deg,#1B2344,#161c38);color:#fff;display:flex;flex-direction:column;padding:20px 16px 22px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .sidebar-close-btn{display:none}
  .sidebar-backdrop{display:none}
  .main-content{flex:1;min-width:0;padding:26px 30px 56px;max-width:1160px}
  .mobile-topbar{display:none}

  .grid-kpi6{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px}
  .grid-kpi4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .grid-kpi3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .grid-2a{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
  .grid-2b{display:grid;grid-template-columns:1fr 1.15fr;gap:16px}
  .grid-2c{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}
  .grid-form2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .grid-form4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .table-scroll{overflow:auto;-webkit-overflow-scrolling:touch}
  .table-scroll table{min-width:640px}

  /* ---- responsivo: abaixo de 900px o menu lateral vira gaveta ---- */
  @media (max-width:900px){
    .app-shell{display:block}
    .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);transition:transform .22s ease;z-index:50;box-shadow:8px 0 30px rgba(20,36,58,.32)}
    .sidebar.sidebar-open{transform:translateX(0)}
    .sidebar-close-btn{display:flex !important;align-items:center;justify-content:center}
    .sidebar-backdrop.show{display:block;position:fixed;inset:0;background:rgba(20,36,58,.42);z-index:45}
    .mobile-topbar{display:flex;align-items:center;gap:12px;padding:14px 16px;background:#fff;border-bottom:1px solid #e2e9f2;position:sticky;top:0;z-index:10;margin:0 -14px 16px}
    .main-content{padding:16px 14px 40px;max-width:100%}
  }
  @media (max-width:700px){
    .grid-2a,.grid-2b,.grid-2c{grid-template-columns:1fr}
    .grid-kpi4{grid-template-columns:repeat(2,1fr)}
    .grid-form2{grid-template-columns:1fr}
    .grid-form4{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:560px){
    .grid-kpi3{grid-template-columns:1fr}
  }
  @media (max-width:420px){
    .grid-kpi4,.grid-form4{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=12"></script>
<script src="app.js?v=12"></script>
</body>
</html>
